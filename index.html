<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAIN — 3D Rotating Text</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #1a1a2e 0%, #0d0d1a 100%);
    overflow: hidden;
    font-family: "Arial Black", "Segoe UI", sans-serif;
  }

  .scene {
    perspective: 800px;
  }

  .word {
    display: flex;
    transform-style: preserve-3d;
    animation: spin 6s linear infinite;
  }

  .word span {
    position: relative;
    display: inline-block;
    font-size: clamp(80px, 18vw, 200px);
    font-weight: 900;
    color: #e0e6ff;
    transform-style: preserve-3d;
    text-shadow:
      1px 1px 0 #6a7bd8,
      2px 2px 0 #5f6fc8,
      3px 3px 0 #5463b8,
      4px 4px 0 #4958a9,
      5px 5px 0 #3e4c99,
      6px 6px 0 #334089,
      7px 7px 0 #283579,
      8px 8px 0 #1d2969,
      10px 10px 20px rgba(0, 0, 0, 0.6);
  }

  /* 글자마다 살짝 다른 깊이감 */
  .word span:nth-child(odd)  { transform: translateZ(30px); }
  .word span:nth-child(even) { transform: translateZ(-30px); }

  @keyframes spin {
    0%   { transform: rotateY(0deg)   rotateX(10deg); }
    50%  { transform: rotateY(180deg) rotateX(-10deg); }
    100% { transform: rotateY(360deg) rotateX(10deg); }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="word">
      <span>M</span><span>A</span><span>I</span><span>N</span>
    </div>
  </div>
</body>
</html>
