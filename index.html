<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAIN — 3D Rotating Text</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* 테마 변수 (기본: 다크) */
  :root {
    --bg-center: #1a1a2e;
    --bg-edge: #0d0d1a;
    --text-face: #e0e6ff;
    --shadow-base: #6a7bd8;
  }
  :root.light {
    --bg-center: #f5f6ff;
    --bg-edge: #dfe3f5;
    --text-face: #2a2f55;
    --shadow-base: #a8b3e8;
  }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, var(--bg-center) 0%, var(--bg-edge) 100%);
    overflow: hidden;
    font-family: "Arial Black", "Segoe UI", sans-serif;
    transition: background 0.4s ease;
  }

  /* 원근감 있는 3D 장면 */
  .scene {
    perspective: 800px;
  }

  .word {
    display: flex;
    transform-style: preserve-3d;
    animation: spin 6s linear infinite;
  }

  .word span {
    position: relative;
    display: inline-block;
    font-size: clamp(80px, 18vw, 200px);
    font-weight: 900;
    color: var(--text-face);
    transform-style: preserve-3d;
    transition: color 0.4s ease;
    /* 겹쳐진 text-shadow로 3D 두께(익스트루전) 표현 */
    text-shadow:
      1px 1px 0 var(--shadow-base),
      2px 2px 0 color-mix(in srgb, var(--shadow-base) 88%, black),
      3px 3px 0 color-mix(in srgb, var(--shadow-base) 76%, black),
      4px 4px 0 color-mix(in srgb, var(--shadow-base) 64%, black),
      5px 5px 0 color-mix(in srgb, var(--shadow-base) 52%, black),
      6px 6px 0 color-mix(in srgb, var(--shadow-base) 40%, black),
      7px 7px 0 color-mix(in srgb, var(--shadow-base) 28%, black),
      8px 8px 0 color-mix(in srgb, var(--shadow-base) 16%, black),
      10px 10px 20px rgba(0, 0, 0, 0.6);
  }

  /* 글자마다 살짝 다른 깊이감 */
  .word span:nth-child(odd)  { transform: translateZ(30px); }
  .word span:nth-child(even) { transform: translateZ(-30px); }

  /* Y축 중심 회전 + X축 흔들림 */
  @keyframes spin {
    0%   { transform: rotateY(0deg)   rotateX(10deg); }
    50%  { transform: rotateY(180deg) rotateX(-10deg); }
    100% { transform: rotateY(360deg) rotateX(10deg); }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="word">
      <span>M</span><span>A</span><span>I</span><span>N</span>
    </div>
  </div>

  <!-- 테마 토글 버튼 -->
  <button id="themeBtn" aria-label="테마 전환"
          style="position: fixed; top: 20px; right: 20px; width: 42px; height: 42px;
                 border-radius: 50%; border: 1px solid var(--shadow-base);
                 background: var(--bg-center); color: var(--text-face);
                 font-size: 20px; cursor: pointer;">🌙</button>

  <script>
    const btn = document.getElementById("themeBtn");
    btn.addEventListener("click", () => {
      const light = document.documentElement.classList.toggle("light");
      btn.textContent = light ? "☀️" : "🌙";
    });
  </script>
</body>
</html>
