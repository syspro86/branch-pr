<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAIN — 3D Rotating Text</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #1a1a2e 0%, #0d0d1a 100%);
    overflow: hidden;
    font-family: "Arial Black", "Segoe UI", sans-serif;
  }

  /* 원근감 있는 3D 장면 */
  .scene {
    perspective: 800px;
  }

  .word {
    display: flex;
    transform-style: preserve-3d;
    animation: spin var(--spin-duration, 6s) linear infinite;
  }

  /* 회전 속도 조절 패널 */
  .controls {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(8px);
    color: #aab3e0;
    font-size: 14px;
    font-family: "Segoe UI", sans-serif;
  }
  .controls input[type="range"] { accent-color: #6a7bd8; }
  .controls output { min-width: 48px; text-align: right; }

  .word span {
    position: relative;
    display: inline-block;
    font-size: clamp(80px, 18vw, 200px);
    font-weight: 900;
    color: #e0e6ff;
    transform-style: preserve-3d;
    /* 겹쳐진 text-shadow로 3D 두께(익스트루전) 표현 */
    text-shadow:
      1px 1px 0 #6a7bd8,
      2px 2px 0 #5f6fc8,
      3px 3px 0 #5463b8,
      4px 4px 0 #4958a9,
      5px 5px 0 #3e4c99,
      6px 6px 0 #334089,
      7px 7px 0 #283579,
      8px 8px 0 #1d2969,
      10px 10px 20px rgba(0, 0, 0, 0.6);
  }

  /* 글자마다 살짝 다른 깊이감 */
  .word span:nth-child(odd)  { transform: translateZ(30px); }
  .word span:nth-child(even) { transform: translateZ(-30px); }

  /* Y축 중심 회전 + X축 흔들림 */
  @keyframes spin {
    0%   { transform: rotateY(0deg)   rotateX(10deg); }
    50%  { transform: rotateY(180deg) rotateX(-10deg); }
    100% { transform: rotateY(360deg) rotateX(10deg); }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="word">
      <span>M</span><span>A</span><span>I</span><span>N</span>
    </div>
  </div>

  <div class="controls">
    <label for="speed">회전 속도</label>
    <input id="speed" type="range" min="1" max="20" value="10" step="1">
    <output id="speedVal">1.0×</output>
  </div>

  <script>
    // 슬라이더 값(1~20) → 배속, duration = 6s / 배속
    const slider = document.getElementById("speed");
    const out = document.getElementById("speedVal");
    const word = document.querySelector(".word");
    function update() {
      const rate = slider.value / 10;              // 0.1× ~ 2.0×
      word.style.setProperty("--spin-duration", (6 / rate) + "s");
      out.textContent = rate.toFixed(1) + "×";
    }
    slider.addEventListener("input", update);
    update();
  </script>
</body>
</html>
